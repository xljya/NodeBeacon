# NodeBeacon node registry.
#
# `labels` is the Prometheus label selector used to query each node's metrics.
# It MUST match the label set your Prometheus actually attaches to the node's
# series (`up`, `node_*`). Verify with:
#   curl -s "$PROMETHEUS_URL/api/v1/query" --data-urlencode 'query=up' | jq '.data.result[].metric'
#
# On the current RS1000 setup:
#   - RS1000's own metrics come from the in-cluster node-exporter DaemonSet
#     (job="node-exporter"); its `instance` is a pod IP and is NOT stable, so we
#     match by job only (single-node cluster => single series).
#   - The four external VPS are scraped by a custom job "external-vps-node" where
#     `instance` is the friendly node name.
#
# Display metadata (name, provider, group, region, countryCode, tags) is chosen
# here and is never inferred from metrics. `region` is a broad display region;
# `countryCode` is the ISO two-letter code used for the national flag. No
# secrets belong in this file.
nodes:
  - id: rs1000
    name: RS1000
    provider: netcup
    group: Core
    region: EU
    countryCode: US
    location: United States
    displayOrder: 10
    public: true
    ipAddress: 10.77.0.1
    clientVersion: node-exporter
    labels:
      job: node-exporter
    tags:
      - k3s
      - prometheus
    detail:
      enabled: true
      visibility: safe
      networkDevices:
        - eth0

  - id: dmit-uswest
    name: dmit-uswest
    provider: DMIT
    group: Edge
    region: US
    countryCode: US
    location: US West
    displayOrder: 20
    public: true
    ipAddress: 10.77.0.2:9100
    clientVersion: node-exporter
    labels:
      job: external-vps-node
      instance: dmit-uswest
    tags:
      - ingress
      - public
    detail:
      enabled: true
      visibility: safe
      networkDevices:
        - eth0
      latencyVantages:
        - rs1000

  - id: hostbrr-4t
    name: hostbrr-4t
    provider: HostBrr
    group: Storage
    region: EU
    countryCode: DE
    location: Germany
    displayOrder: 30
    public: true
    ipAddress: 10.77.0.3:9100
    clientVersion: node-exporter
    labels:
      job: external-vps-node
      instance: hostbrr-4t
    tags:
      - storage
    detail:
      enabled: true
      visibility: safe
      networkDevices:
        - eth0
      diskMounts:
        - /
        - /mnt/data
      latencyVantages:
        - rs1000

  - id: netcup-1o
    name: netcup-1o
    provider: netcup
    group: Compute
    region: EU
    countryCode: DE
    location: Germany
    displayOrder: 40
    public: true
    ipAddress: 10.77.0.4:9100
    clientVersion: node-exporter
    labels:
      job: external-vps-node
      instance: netcup-1o
    tags:
      - vps
    detail:
      enabled: true
      visibility: safe
      networkDevices:
        - eth0
      latencyVantages:
        - rs1000

  - id: huawei-2c1g
    name: huawei-2c1g
    provider: Huawei Cloud
    group: CN
    region: CN
    countryCode: CN
    location: China
    displayOrder: 50
    public: true
    ipAddress: 10.77.0.5:9100
    clientVersion: node-exporter
    labels:
      job: external-vps-node
      instance: huawei-2c1g
    tags:
      - vps
    detail:
      enabled: true
      visibility: safe
      networkDevices:
        - eth0
      latencyVantages:
        - rs1000
