# Apply the whole stack with:
#   kubectl apply -k infra/k8s
#
# The Secret is intentionally NOT listed here — create it out of band from
# secret.example.yaml so real values never live in the repo.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nodebeacon
resources:
  - namespace.yaml
  - configmap-nodes.yaml
  - configmap-ripe-atlas.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - servicemonitor.yaml
  - prometheusrule.yaml
  - alertmanagerconfig.yaml
  - executor.yaml
  - managed-probes.yaml
  - managed-alerts.yaml
