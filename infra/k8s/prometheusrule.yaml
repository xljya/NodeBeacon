apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: nodebeacon
  labels:
    release: monitoring
spec:
  groups:
    - name: nodebeacon.rules
      rules:
        - alert: NodeBeaconUnavailable
          expr: absent(up{job="nodebeacon"} == 1) or max(up{job="nodebeacon"}) == 0
          for: 2m
          labels:
            severity: critical
            namespace: nodebeacon
            node_id: rs1000
          annotations:
            summary: NodeBeacon is unavailable
            description: Prometheus cannot scrape the NodeBeacon service for two minutes.
        - alert: NodeBeaconPrometheusQueryErrors
          expr: |
            sum(rate(nodebeacon_prometheus_queries_total{outcome="error"}[5m]))
              /
            clamp_min(sum(rate(nodebeacon_prometheus_queries_total[5m])), 0.001)
              > 0.10
          for: 5m
          labels:
            severity: warning
            namespace: nodebeacon
            node_id: rs1000
          annotations:
            summary: NodeBeacon Prometheus query error rate is high
            description: More than 10% of NodeBeacon Prometheus API calls failed over five minutes.
        - alert: NodeBeaconPrometheusQueryLatencyHigh
          expr: |
            histogram_quantile(
              0.95,
              sum by (le) (rate(nodebeacon_prometheus_query_duration_seconds_bucket[5m]))
            ) > 2
          for: 5m
          labels:
            severity: warning
            namespace: nodebeacon
            node_id: rs1000
          annotations:
            summary: NodeBeacon Prometheus query latency is high
            description: The p95 Prometheus API latency observed by NodeBeacon exceeds two seconds.
        - alert: NodeBeaconAlertmanagerReadErrors
          expr: |
            sum(rate(nodebeacon_alertmanager_reads_total{outcome!="success"}[5m]))
              /
            clamp_min(sum(rate(nodebeacon_alertmanager_reads_total[5m])), 0.001)
              > 0.10
          for: 5m
          labels:
            severity: warning
            namespace: nodebeacon
            node_id: rs1000
          annotations:
            summary: NodeBeacon cannot reliably read Alertmanager
            description: More than 10% of NodeBeacon Alertmanager API reads failed over five minutes.
        - alert: NodeBeaconWebhookFailures
          expr: |
            sum(increase(nodebeacon_alertmanager_webhook_requests_total{outcome!="success"}[10m])) >= 3
          for: 1m
          labels:
            severity: critical
            namespace: nodebeacon
            node_id: rs1000
          annotations:
            summary: NodeBeacon Alertmanager webhook is repeatedly failing
            description: At least three webhook requests failed authentication, validation, configuration, or persistence within ten minutes.
        - alert: NodeBeaconBackupStale
          expr: |
            nodebeacon_backup_last_success_timestamp_seconds > 0
              and time() - nodebeacon_backup_last_success_timestamp_seconds > 36 * 60 * 60
              and time() - nodebeacon_backup_last_success_timestamp_seconds <= 72 * 60 * 60
          for: 15m
          labels:
            severity: warning
            namespace: nodebeacon
            node_id: rs1000
          annotations:
            summary: NodeBeacon off-site backup is stale
            description: The last successful off-site NodeBeacon backup is more than 36 hours old.
        - alert: NodeBeaconBackupMissing
          expr: |
            nodebeacon_backup_last_success_timestamp_seconds == 0
              or time() - nodebeacon_backup_last_success_timestamp_seconds > 72 * 60 * 60
          for: 15m
          labels:
            severity: critical
            namespace: nodebeacon
            node_id: rs1000
          annotations:
            summary: NodeBeacon off-site backup is missing
            description: No valid backup success timestamp exists, or the last successful off-site backup is more than 72 hours old.
