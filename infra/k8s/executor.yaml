apiVersion: v1
kind: Service
metadata:
  name: nodebeacon-executor
  namespace: nodebeacon
  labels:
    app.kubernetes.io/name: nodebeacon-executor
spec:
  selector:
    app.kubernetes.io/name: nodebeacon-executor
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodebeacon-executor
  namespace: nodebeacon
  labels:
    app.kubernetes.io/name: nodebeacon-executor
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: nodebeacon-executor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nodebeacon-executor
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: executor
          image: nodebeacon:1.1.3
          imagePullPolicy: Never
          command: ["node", "apps/api/dist/executor.js"]
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests: { cpu: "25m", memory: "64Mi" }
            limits: { cpu: "250m", memory: "192Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: remote-ssh
              mountPath: /var/run/nodebeacon-ssh
              readOnly: true
      volumes:
        - name: remote-ssh
          secret:
            secretName: nodebeacon-remote-ssh
            optional: true
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nodebeacon-executor
  namespace: nodebeacon
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nodebeacon-executor
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nodebeacon
      ports: [{ protocol: TCP, port: 8080 }]
  egress:
    - to: [{ namespaceSelector: {} }]
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
    - to:
        - ipBlock: { cidr: 10.77.0.0/24 }
      ports: [{ protocol: TCP, port: 22 }]
