# Runtime state PVC for the YAML registry plus SQLite sessions and audit log.
# k3s provisions it with the default local-path StorageClass.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nodebeacon-data
  namespace: nodebeacon
  labels:
    app.kubernetes.io/name: nodebeacon
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  # storageClassName omitted -> uses the cluster default (local-path on k3s).
