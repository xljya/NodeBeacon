# Node registry mounted into the pod at /config/nodes.yaml.
# The Deployment sets NODEBEACON_NODE_CONFIG=/config/nodes.yaml to load this.
#
# The `labels` selectors below are verified against the live RS1000 Prometheus:
#   - rs1000 -> job="node-exporter" (in-cluster DaemonSet; single-node cluster)
#   - the four VPS -> job="external-vps-node", instance=<friendly name>
# This is display + query metadata only. `region` is a broad display region;
# `countryCode` is the ISO two-letter code used for the national flag. No secrets.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nodebeacon-nodes
  namespace: nodebeacon
  labels:
    app.kubernetes.io/name: nodebeacon
data:
  nodes.yaml: |
    nodes:
      - id: rs1000
        name: RS1000
        provider: netcup
        group: Core
        region: EU
        countryCode: US
        location: United States
        displayOrder: 10
        public: true
        ipAddress: 10.77.0.1
        clientVersion: node-exporter
        labels:
          job: node-exporter
        tags:
          - k3s
          - prometheus
        detail:
          enabled: true
          visibility: safe
          networkDevices:
            - eth0

      - id: dmit-uswest
        name: dmit-uswest
        provider: DMIT
        group: Edge
        region: US
        countryCode: US
        location: US West
        displayOrder: 20
        public: true
        ipAddress: 10.77.0.2:9100
        clientVersion: node-exporter
        labels:
          job: external-vps-node
          instance: dmit-uswest
        tags:
          - ingress
          - public
        detail:
          enabled: true
          visibility: safe
          networkDevices:
            - eth0
          latencyVantages:
            - rs1000

      - id: hostbrr-4t
        name: hostbrr-4t
        provider: HostBrr
        group: Storage
        region: EU
        countryCode: DE
        location: Germany
        displayOrder: 30
        public: true
        ipAddress: 10.77.0.3:9100
        clientVersion: node-exporter
        labels:
          job: external-vps-node
          instance: hostbrr-4t
        tags:
          - storage
        detail:
          enabled: true
          visibility: safe
          networkDevices:
            - eth0
          diskMounts:
            - /
            - /mnt/data
          latencyVantages:
            - rs1000

      - id: netcup-1o
        name: netcup-1o
        provider: netcup
        group: Compute
        region: EU
        countryCode: DE
        location: Germany
        displayOrder: 40
        public: true
        ipAddress: 10.77.0.4:9100
        clientVersion: node-exporter
        labels:
          job: external-vps-node
          instance: netcup-1o
        tags:
          - vps
        detail:
          enabled: true
          visibility: safe
          networkDevices:
            - eth0
          latencyVantages:
            - rs1000

      - id: huawei-2c1g
        name: huawei-2c1g
        provider: Huawei Cloud
        group: CN
        region: CN
        countryCode: CN
        location: China
        displayOrder: 50
        public: true
        ipAddress: 10.77.0.5:9100
        clientVersion: node-exporter
        labels:
          job: external-vps-node
          instance: huawei-2c1g
        tags:
          - vps
        detail:
          enabled: true
          visibility: safe
          networkDevices:
            - eth0
          latencyVantages:
            - rs1000
