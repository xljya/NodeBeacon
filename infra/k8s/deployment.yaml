apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodebeacon
  namespace: nodebeacon
  labels:
    app.kubernetes.io/name: nodebeacon
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nodebeacon
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nodebeacon
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: nodebeacon
          # Built on the node and imported into containerd, so never pull.
          image: nodebeacon:0.2.4
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: NODE_ENV
              value: "production"
            - name: API_HOST
              value: "0.0.0.0"
            - name: API_PORT
              value: "3001"
            - name: WEB_ORIGIN
              value: "https://monitor.liucf.com"
            # In-cluster Prometheus (no auth needed inside the cluster).
            - name: PROMETHEUS_URL
              value: "http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090"
            - name: PROMETHEUS_TIMEOUT_MS
              value: "5000"
            - name: STATUS_CACHE_TTL_SECONDS
              value: "30"
            - name: NODEBEACON_NODE_CONFIG
              value: "/config/nodes.yaml"
            - name: ALLOW_REGISTER
              value: "false"
            - name: APP_VERSION
              value: "0.2.4"
            # Only this GitHub login is accepted as owner (not a secret).
            - name: GITHUB_OWNER_LOGIN
              value: "xljya"
            - name: GITHUB_CALLBACK_URL
              value: "https://monitor.liucf.com/api/auth/github/callback"
          # Secret supplies COOKIE_SECRET and the owner credentials
          # (INITIAL_OWNER_EMAIL / INITIAL_OWNER_PASSWORD). optional so the pod
          # starts before the Secret exists (login stays disabled until then).
          envFrom:
            - secretRef:
                name: nodebeacon-secrets
                optional: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "96Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: node-config
              mountPath: /config
              readOnly: true
            # Reserved for P3 SQLite (sessions / incidents). Unused in P1.
            - name: data
              mountPath: /data
            # Fastify/pino need a writable tmp with readOnlyRootFilesystem.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: node-config
          configMap:
            name: nodebeacon-nodes
        - name: data
          persistentVolumeClaim:
            claimName: nodebeacon-data
        - name: tmp
          emptyDir: {}
