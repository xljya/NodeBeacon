apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodebeacon
  namespace: nodebeacon
  labels:
    app.kubernetes.io/name: nodebeacon
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nodebeacon
  strategy:
    # The SQLite database and YAML registry are single-writer state on one PVC.
    # A short Recreate deployment avoids overlapping old/new writers.
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nodebeacon
    spec:
      serviceAccountName: nodebeacon-control
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: nodebeacon
          # Built on the node and imported into containerd, so never pull.
          image: nodebeacon:1.0.39
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: NODE_ENV
              value: "production"
            - name: API_HOST
              value: "0.0.0.0"
            - name: API_PORT
              value: "3001"
            - name: WEB_ORIGIN
              value: "https://monitor.liucf.com"
            # In-cluster Prometheus (no auth needed inside the cluster).
            - name: PROMETHEUS_URL
              value: "http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090"
            - name: PROMETHEUS_TIMEOUT_MS
              value: "5000"
            - name: STATUS_CACHE_TTL_SECONDS
              value: "30"
            - name: ALERTMANAGER_URL
              value: "http://monitoring-kube-prometheus-alertmanager.monitoring.svc.cluster.local:9093"
            - name: ALERTMANAGER_TIMEOUT_MS
              value: "5000"
            - name: NODEBEACON_NODE_CONFIG
              value: "/data/nodes.yaml"
            - name: NODEBEACON_NODE_CONFIG_SEED
              value: "/config/nodes.yaml"
            - name: NODEBEACON_DATABASE_PATH
              value: "/data/nodebeacon.db"
            - name: INCIDENT_RETENTION_DAYS
              value: "180"
            - name: AUDIT_RETENTION_DAYS
              value: "365"
            - name: REVOKED_SESSION_RETENTION_DAYS
              value: "30"
            - name: NODEBEACON_BACKUP_SUCCESS_PATH
              value: "/data/backup-last-success.timestamp"
            - name: NODEBEACON_BACKUP_REQUEST_PATH
              value: "/data/backup-request.json"
            - name: NODEBEACON_BACKUP_LAST_RESULT_PATH
              value: "/data/backup-last-result.json"
            - name: LOKI_URL
              value: "http://loki-gateway.logging.svc.cluster.local"
            - name: NOTIFICATION_ALLOWED_HOSTS
              value: "api.telegram.org"
            - name: ALLOW_REGISTER
              value: "false"
            # APP_VERSION is intentionally not set: the app reads the release
            # version from the root package.json baked into the image, so the
            # image tag above is the only per-release edit in this file.
            # Blackbox HTTP probe job shown on /api/latency ("" disables it).
            - name: PROBE_JOB
              value: "blackbox-http-public"
            # Public RIPE Atlas measurement IDs and Zhejiang probe metadata.
            # The optional ConfigMap is created after the one-time setup script;
            # no RIPE API key is stored in the application.
            - name: RIPE_ATLAS_CONFIG_PATH
              value: "/ripe-atlas/measurements.json"
            - name: RIPE_ATLAS_TIMEOUT_MS
              value: "10000"
            # Only this GitHub login is accepted as owner (not a secret).
            - name: GITHUB_OWNER_LOGIN
              value: "xljya"
            - name: GITHUB_CALLBACK_URL
              value: "https://monitor.liucf.com/api/auth/github/callback"
            # Secret supplies COOKIE_SECRET and the owner credentials
            # (INITIAL_OWNER_EMAIL / INITIAL_OWNER_PASSWORD), OAuth credentials,
            # and ALERTMANAGER_WEBHOOK_TOKEN. optional so the pod
            # starts before the Secret exists (login stays disabled until then).
          envFrom:
            - secretRef:
                name: nodebeacon-secrets
                optional: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "96Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: node-config
              mountPath: /config
              readOnly: true
            - name: ripe-atlas-config
              mountPath: /ripe-atlas
              readOnly: true
            # Runtime YAML registry plus SQLite sessions and audit events.
            - name: data
              mountPath: /data
            # Fastify/pino need a writable tmp with readOnlyRootFilesystem.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: node-config
          configMap:
            name: nodebeacon-nodes
        - name: ripe-atlas-config
          configMap:
            name: nodebeacon-ripe-atlas
            optional: true
        - name: data
          persistentVolumeClaim:
            claimName: nodebeacon-data
        - name: tmp
          emptyDir: {}
