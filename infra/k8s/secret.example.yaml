# EXAMPLE ONLY — do not commit real values. Copy to a private secret.yaml
# (git-ignored) and fill in, or create imperatively:
#
#   kubectl -n nodebeacon create secret generic nodebeacon-secrets \
#     --from-literal=COOKIE_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=INITIAL_OWNER_EMAIL="you@example.com" \
#     --from-literal=INITIAL_OWNER_PASSWORD="a-strong-password"
#
# COOKIE_SECRET signs the session cookie; INITIAL_OWNER_* provisions the single
# admin (owner) account used by /admin. The Deployment references this Secret
# with optional: true and pulls these keys via envFrom, so login stays disabled
# until the Secret exists.
#
# Prometheus is queried in-cluster without auth, so PROMETHEUS_* creds are only
# needed if you point the app at an externally authenticated Prometheus.
apiVersion: v1
kind: Secret
metadata:
  name: nodebeacon-secrets
  namespace: nodebeacon
  labels:
    app.kubernetes.io/name: nodebeacon
type: Opaque
stringData:
  COOKIE_SECRET: "replace-with-a-random-32-byte-secret"
  INITIAL_OWNER_EMAIL: "you@example.com"
  INITIAL_OWNER_PASSWORD: "replace-me-before-production"
  # GitHub OAuth (optional). GITHUB_OWNER_LOGIN is set as a plain env in the
  # Deployment; only the client id/secret are sensitive.
  GITHUB_CLIENT_ID: ""
  GITHUB_CLIENT_SECRET: ""
  # PROMETHEUS_BASIC_AUTH_USERNAME: ""
  # PROMETHEUS_BASIC_AUTH_PASSWORD: ""
  # PROMETHEUS_BEARER_TOKEN: ""
