apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: rs1000-public-egress
  namespace: monitoring
  labels:
    release: monitoring
    app.kubernetes.io/part-of: nodebeacon
spec:
  jobName: blackbox-tcp-egress
  interval: 30s
  scrapeTimeout: 10s
  module: tcp_connect_ipv4
  prober:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - 1.1.1.1:443
        - 8.8.8.8:443
      labels:
        env: lab
        node_id: rs1000
        role: monitoring-egress
        probe_type: public-ip
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
