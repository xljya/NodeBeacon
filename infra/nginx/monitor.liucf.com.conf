# RS1000 nginx entry for NodeBeacon. Lives at
#   /etc/nginx/conf.d/monitor.liucf.com.conf
#
# Chain: monitor.liucf.com -> Cloudflare (proxied) -> RS1000 nginx :443
#        -> http://10.77.0.1:31003 (k3s Service nodebeacon, NodePort 31003)
#
# This mirrors the config already live on RS1000. It is committed for
# traceability; the running copy is managed on the host (certs by Certbot).

# Cloudflare's edge is the only public HTTP(S) source for this origin. Keep the
# original peer address for the allowlist while restoring the visitor address
# for logs and upstream applications. The ranges are synced from the official
# lists at https://www.cloudflare.com/ips-v4 and /ips-v6.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# Evaluate the source allowlist against the pre-realip peer address. Checking
# only that CF-Connecting-IP exists is not authentication: direct clients can
# supply that header themselves.
geo $realip_remote_addr $nodebeacon_cf_source_allowed {
    default 0;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}

# Keep dynamic/API state out of browser and Cloudflare caches while allowing
# Vite's content-hashed assets to remain immutable. `map` is valid at the http
# level, which includes files under nginx/conf.d.
map $uri $nodebeacon_cache_control {
    default     "no-cache";
    ~^/api/     "no-store";
    ~^/assets/  "public, max-age=31536000, immutable";
}

# Keep authentication and administration routes out of search indexes while
# leaving the public status page indexable. nginx omits headers with an empty
# value, so this can be applied once at server scope without location copies.
map $uri $nodebeacon_robots_tag {
    default                         "";
    ~^/(admin(?:/|$)|login(?:/|$)) "noindex, nofollow";
}

map $http_upgrade $nodebeacon_connection_upgrade {
    default upgrade;
    ''      close;
}

# Cloudflare header guard: reject any request that did not come through
# Cloudflare (direct-to-origin scans get a 404).
server {
    if ($host = monitor.liucf.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name monitor.liucf.com;

    if ($nodebeacon_cf_source_allowed = 0) {
        return 404;
    }

    if ($http_cf_connecting_ip = "") {
        return 404;
    }

    client_max_body_size 10M;

    proxy_hide_header Cache-Control;
    add_header Cache-Control $nodebeacon_cache_control always;
    add_header X-Robots-Tag $nodebeacon_robots_tag always;

    # NodeBeacon's own Prometheus metrics are for the in-cluster scraper only.
    location = /metrics {
        return 404;
    }

    # Alertmanager reaches this endpoint through the cluster Service only.
    location = /api/webhooks/alertmanager {
        return 404;
    }

    location ~ ^/api/admin/remote/sessions/[^/]+/ws$ {
        proxy_pass http://10.77.0.1:31003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $nodebeacon_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 2h;
        proxy_send_timeout 2h;
    }

    location / {
        proxy_pass http://10.77.0.1:31003;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name monitor.liucf.com;

    if ($nodebeacon_cf_source_allowed = 0) {
        return 404;
    }

    if ($http_cf_connecting_ip = "") {
        return 404;
    }

    ssl_certificate /etc/letsencrypt/live/monitor.liucf.com/fullchain.pem;      # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/monitor.liucf.com/privkey.pem;    # managed by Certbot

    client_max_body_size 10M;

    proxy_hide_header Cache-Control;
    add_header Cache-Control $nodebeacon_cache_control always;
    add_header X-Robots-Tag $nodebeacon_robots_tag always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; manifest-src 'self'; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    # NodeBeacon's own Prometheus metrics are for the in-cluster scraper only.
    location = /metrics {
        return 404;
    }

    # Alertmanager reaches this endpoint through the cluster Service only.
    location = /api/webhooks/alertmanager {
        return 404;
    }

    location ~ ^/api/admin/remote/sessions/[^/]+/ws$ {
        proxy_pass http://10.77.0.1:31003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $nodebeacon_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 2h;
        proxy_send_timeout 2h;
    }

    location / {
        proxy_pass http://10.77.0.1:31003;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

# --- Cloudflare-side rules (exact expressions and rollout steps) ---
# See infra/cloudflare.md. Origin Cache-Control remains the final safety net.
