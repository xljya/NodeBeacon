apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitor-status
  namespace: sre-lab
  labels:
    app: monitor-status
spec:
  replicas: 2
  selector:
    matchLabels:
      app: monitor-status
  template:
    metadata:
      labels:
        app: monitor-status
    spec:
      containers:
        - name: monitor-status
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command:
            - python
            - /app/app.py
          env:
            - name: PROMETHEUS_URL
              value: http://monitoring-kube-prometheus-prometheus.monitoring:9090
            - name: PORT
              value: "8080"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 30m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 160Mi
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
      volumes:
        - name: app
          configMap:
            name: monitor-status-app
---
apiVersion: v1
kind: Service
metadata:
  name: monitor-status
  namespace: sre-lab
  labels:
    app: monitor-status
spec:
  type: NodePort
  selector:
    app: monitor-status
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 31003
